  <meta charset="UTF-8">

<nav class="navbar  px-4 py-3 shadow-sm">
  <a class="navbar-brand d-flex align-items-center gap-2" href="#">
    <i class="bi bi-person-lines-fill fs-3 text-primary"></i>
    <div>
    <span>ContactHub</span>
    <div class="text-muted small">Smart Contact Manager</div>
    </div>
  </a>

  <div class="d-flex align-items-center gap-3 pic">
   <button class="btn btn-primary rounded-pill px-4" id="addContactBtn">
  <i class="bi bi-plus"></i> Add Contact
</button>


    <i class="bi bi-bell fs-5"></i>
    <i class="bi bi-gear fs-5"></i>
    <img src="avatar-4.jpg" class="rounded-circle">
  </div>
</nav>

<!-- Content ----------------------------------------------------------------->
<div class="container-fluid px-5 mt-4">
  <div class="row g-3">

    <!-- Stts--------------------------------------------------------------- -->
    <div class="col-md-4">
      <div class="card stat-card p-4">
        <div class="d-flex align-items-center gap-3">
          <div class="icon-box bg-blue"><i class="bi bi-people"></i></div>
          <div>
          <div class="text-muted">TOTAL</div>
          <h3 class="fw-bold mb-0">0</h3>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card stat-card p-4">
        <div class="d-flex align-items-center gap-3">
          <div class="icon-box bg-orange"><i class="bi bi-star-fill"></i></div>
          <div>
          <div class="text-muted">FAVORITES</div>
          <h3 class="fw-bold mb-0">0</h3>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card stat-card p-4">
        <div class="d-flex align-items-center gap-3">
          <div class="icon-box bg-red"><i class="bi bi-heart-pulse"></i></div>
          <div>
          <div class="text-muted">EMERGENCY</div>
          <h3 class="fw-bold mb-0">0</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Main -------------------------------------------------------------------------------------->
    <div class="col-md-8">
      <h2 class="fw-bold mt-4">All Contacts</h2>
      <p class="text-muted">Manage and organize your 0 contacts</p>

      <input type="text" class="form-control search-box mb-4" placeholder="Search by name, phone, or email...">

      <div class="card empty-box " id="emptyBox" >
        <i class="bi bi-person-square fs-1 mb-3"></i>
        <p>No contacts found</p>  mm
      </div>
    </div>

    <!-- Sidebar ------------------------------------------------------------------------------->
    <div class="col-md-4">

      <div class="card side-card mb-4">
        <div class="p-4 d-flex gap-3 align-items-center">
          <div class="icon-box bg-orange"><i class="bi bi-star-fill"></i></div>
          <div>
            <h6 class="fw-bold mb-0">Favorites</h6>
            <small class="text-muted">Quick access to starred contacts</small>
          </div>
        </div>
        <div class="text-center text-muted pb-4">No favorites yet</div>
      </div>

      <div class="card side-card">
        <div class="p-4 d-flex gap-3 align-items-center">
          <div class="icon-box bg-red"><i class="bi bi-heart-pulse"></i></div>
          <div>
            <h6 class="fw-bold mb-0">Emergency</h6>
            <small class="text-muted">Important contacts for urgent calls</small>
          </div>
        </div>
        <div class="text-center text-muted pb-4">No emergency contacts</div>
      </div>

    </div>

  </div>
</div>


<div class="modal fade" id="addContactModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content p-4 rounded-4">

      <div class="modal-header border-0">
        <h4 class="modal-title fw-bold">Add New Contact</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" id="closeModal"></button>
      </div>

      <!-- Body-form------------------------------------------------------------------------------------>
      <div class="modal-body">
        <!-- Name -------------------------------------------------------------->
        <label class="form-label fw-semibold">Full Name</label>
        <input oninput="validation()" type="text" class="form-control custom-input mb-3"
               placeholder="Full Name" id="fullName">
        <!-- Phone ---------------------------------------------------------------------------->
        <label class="form-label fw-semibold">Phone Number</label>
        <input oninput="validationNum()" type="text" class="form-control custom-input mb-3"
               placeholder="e.g." id="phone">
               

        <!-- Email -------------------------------------------->
        <label class="form-label fw-semibold">Email Address</label>
        <input type="email" class="form-control custom-input mb-3" id="email" >
       
        <!-- Address --------------------------------------------------------------->
        <label class="form-label fw-semibold">Address</label>
        <input type="text" class="form-control custom-input mb-3"
               placeholder=" address" id="address">

        <!-- Group ------------------------------------------------------->
        <label class="form-label fw-semibold">Group</label>
        <select class="form-control custom-input mb-3" id="group">
          <option>Select a group</option>
          <option>Family</option>
          <option>Friends</option>
          <option>Work</option>
          <option>school</option>
          <option>others</option>
        </select>

        <!-- Notes ---------------------------------------->
        <label class="form-label fw-semibold">Notes</label>
        <textarea class="form-control custom-input mb-4"
                  placeholder="Add notes " id="notes"></textarea>

        <!-- Checkboxe------------------------------------- -->
        <div class="d-flex gap-4 mb-4">
          <label class="d-flex align-items-center gap-2">
            <input type="checkbox">
            <span class="text-warning fw-semibold">★ Favorite</span>
          </label>

          <label class="d-flex align-items-center gap-2">
            <input type="checkbox">
            <span class="text-danger fw-semibold">❤️ Emergency</span>
          </label>
        </div>

        <!-- Buttons ----------------------------------------->
        <div class="d-flex justify-content-between">
          <button class="btn btn-light px-5 py-2 rounded-pill"
                  data-bs-dismiss="modal">
            Cancel
          </button>

          <button class="btn btn-primary px-5 py-2 rounded-pill">
            ✔ Save Contact
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
